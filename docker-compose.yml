services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: stepan_user
      POSTGRES_PASSWORD: stepan_password
      POSTGRES_DB: stepan_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    restart: always
    environment:
      DATABASE_URL: postgresql://stepan_user:stepan_password@db:5432/stepan_db
    depends_on:
      - db
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  postgres_data: